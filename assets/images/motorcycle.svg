<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c24"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e5c07b"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e39"/>
      <stop offset="60%" stop-color="#161820"/>
      <stop offset="100%" stop-color="#0e1015"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d90429" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d90429" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <rect width="900" height="500" rx="16" fill="url(#bgGrad)"/>
  <circle cx="450" cy="270" r="260" fill="url(#redGlow)"/>

  <!-- Ground Shadow -->
  <ellipse cx="450" cy="430" rx="360" ry="25" fill="#000000" opacity="0.8"/>

  <!-- REAR WHEEL -->
  <g id="rear-wheel">
    <circle cx="230" cy="340" r="95" fill="none" stroke="#252a35" stroke-width="26"/>
    <circle cx="230" cy="340" r="82" fill="none" stroke="#12151b" stroke-width="6"/>
    <circle cx="230" cy="340" r="68" fill="none" stroke="#d4af37" stroke-width="3" opacity="0.7"/>
    <circle cx="230" cy="340" r="38" fill="#1b1f28" stroke="#374151" stroke-width="4"/>
    <circle cx="230" cy="340" r="14" fill="url(#goldAccent)"/>
    <!-- Spokes -->
    <path d="M230,258 L230,422 M148,340 L312,340 M172,282 L288,398 M172,398 L288,282" stroke="#4b5563" stroke-width="2.5" opacity="0.6"/>
    <!-- Brake Disc -->
    <circle cx="230" cy="340" r="52" fill="none" stroke="#6b7280" stroke-width="4" stroke-dasharray="6 4"/>
  </g>

  <!-- FRONT WHEEL -->
  <g id="front-wheel">
    <circle cx="670" cy="340" r="95" fill="none" stroke="#252a35" stroke-width="26"/>
    <circle cx="670" cy="340" r="82" fill="none" stroke="#12151b" stroke-width="6"/>
    <circle cx="670" cy="340" r="68" fill="none" stroke="#d4af37" stroke-width="3" opacity="0.7"/>
    <circle cx="670" cy="340" r="38" fill="#1b1f28" stroke="#374151" stroke-width="4"/>
    <circle cx="670" cy="340" r="14" fill="url(#goldAccent)"/>
    <!-- Spokes -->
    <path d="M670,258 L670,422 M588,340 L752,340 M612,282 L728,398 M612,398 L728,282" stroke="#4b5563" stroke-width="2.5" opacity="0.6"/>
    <!-- Front Brake Rotor -->
    <circle cx="670" cy="340" r="56" fill="none" stroke="#9ca3af" stroke-width="5" stroke-dasharray="8 5"/>
  </g>

  <!-- SWINGARM & EXHAUST -->
  <path d="M230,340 L380,330 L450,345" stroke="#4b5563" stroke-width="12" stroke-linecap="round"/>
  <!-- Signature Upswept Chrome Exhaust Pipe -->
  <path d="M430,320 Q480,380 520,380 L350,380 Q300,380 270,360 L200,340" fill="none" stroke="#9ca3af" stroke-width="14" stroke-linecap="round"/>
  <path d="M430,320 Q480,380 520,380 L350,380 Q300,380 270,360 L200,340" fill="none" stroke="url(#goldAccent)" stroke-width="3" stroke-dasharray="100 150"/>
  <polygon points="190,332 205,338 200,348 185,342" fill="#d4af37"/>

  <!-- ENGINE BLOCK (The Thump) -->
  <rect x="360" y="270" width="130" height="90" rx="8" fill="#1f242d" stroke="#374151" stroke-width="3"/>
  <!-- Cooling Fins -->
  <line x1="365" y1="285" x2="485" y2="285" stroke="#4b5563" stroke-width="4"/>
  <line x1="365" y1="298" x2="485" y2="298" stroke="#4b5563" stroke-width="4"/>
  <line x1="365" y1="311" x2="485" y2="311" stroke="#4b5563" stroke-width="4"/>
  <line x1="365" y1="324" x2="485" y2="324" stroke="#4b5563" stroke-width="4"/>
  <line x1="375" y1="337" x2="475" y2="337" stroke="#4b5563" stroke-width="4"/>
  <!-- Crankcase Badge -->
  <circle cx="425" cy="340" r="22" fill="#11141a" stroke="url(#goldAccent)" stroke-width="2"/>
  <circle cx="425" cy="340" r="6" fill="#d4af37"/>

  <!-- CHASSIS FRAME -->
  <path d="M230,340 L340,240 L450,225 L580,210 L630,260 L670,340" fill="none" stroke="#252a35" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M340,240 L380,340" fill="none" stroke="#252a35" stroke-width="10"/>

  <!-- FRONT FORKS -->
  <line x1="600" y1="185" x2="670" y2="340" stroke="#d1d5db" stroke-width="10" stroke-linecap="round"/>
  <line x1="590" y1="185" x2="660" y2="340" stroke="#4b5563" stroke-width="8" stroke-linecap="round"/>
  <!-- Front Fender / Mudguard -->
  <path d="M625,270 Q670,250 715,280" fill="none" stroke="#1f242d" stroke-width="10" stroke-linecap="round"/>
  <path d="M625,270 Q670,250 715,280" fill="none" stroke="#d4af37" stroke-width="2"/>

  <!-- FUEL TANK (Classic Teardrop) -->
  <path d="M430,220 C430,175 490,165 570,185 C585,190 595,210 580,225 C540,240 450,240 430,220 Z" fill="url(#tankGrad)" stroke="#374151" stroke-width="2"/>
  <!-- Tank Crimson & Gold Striping -->
  <path d="M450,215 C470,185 530,180 565,195" fill="none" stroke="#d90429" stroke-width="6"/>
  <path d="M455,220 C475,195 525,190 558,202" fill="none" stroke="url(#goldAccent)" stroke-width="2.5"/>
  <!-- Tank Badge -->
  <text x="505" y="212" font-family="'Oswald', sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1">ROYAL ENFIELD</text>

  <!-- SEAT (Classic Ribbed Leather) -->
  <path d="M300,235 C330,215 410,215 440,225 C430,238 390,245 310,245 Z" fill="#451a03" stroke="#2a1202" stroke-width="2"/>
  <!-- Ribs -->
  <line x1="330" y1="228" x2="333" y2="242" stroke="#2b1002" stroke-width="3"/>
  <line x1="355" y1="225" x2="358" y2="242" stroke="#2b1002" stroke-width="3"/>
  <line x1="380" y1="224" x2="383" y2="241" stroke="#2b1002" stroke-width="3"/>
  <line x1="405" y1="225" x2="408" y2="238" stroke="#2b1002" stroke-width="3"/>

  <!-- REAR FENDER & TAIL LIGHT -->
  <path d="M190,310 Q220,245 295,240" fill="none" stroke="#1f242d" stroke-width="12" stroke-linecap="round"/>
  <circle cx="185" cy="305" r="7" fill="#ef4444"/>

  <!-- HANDLEBARS & MIRRORS -->
  <path d="M580,185 L590,150 L630,145" fill="none" stroke="#e5e7eb" stroke-width="6" stroke-linecap="round"/>
  <circle cx="585" cy="130" r="9" fill="#1f242d" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="588" y1="138" x2="592" y2="152" stroke="#e5e7eb" stroke-width="3"/>

  <!-- HEADLIGHT (Iconic Round Nacelle) -->
  <path d="M610,180 Q645,190 635,215 Q605,210 605,185 Z" fill="#1f242d" stroke="#374151" stroke-width="2"/>
  <circle cx="638" cy="198" r="16" fill="#fef08a" opacity="0.85"/>
  <circle cx="638" cy="198" r="16" fill="none" stroke="url(#goldAccent)" stroke-width="3"/>
  <!-- Headlamp Beam / Halo Glow -->
  <polygon points="654,198 870,140 890,320" fill="#fef08a" opacity="0.12"/>

  <!-- Modern Graphic Overlay Tags -->
  <rect x="50" y="45" width="165" height="32" rx="16" fill="#1e2430" stroke="#3b4252" stroke-width="1"/>
  <circle cx="68" cy="61" r="5" fill="#22c55e"/>
  <text x="82" y="66" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">HUNTER & HIMALAYAN</text>

  <rect x="680" y="45" width="170" height="32" rx="16" fill="#1e2430" stroke="#d4af37" stroke-width="1"/>
  <text x="765" y="66" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#d4af37">PURE MOTORCYCLING</text>
</svg>
