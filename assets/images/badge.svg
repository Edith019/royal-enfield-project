<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#997a15"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d90429"/>
      <stop offset="100%" stop-color="#7a0010"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#d4af37" flood-opacity="0.3"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="92" fill="#12151b" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#2a303c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="100" cy="100" r="76" fill="url(#crimsonGrad)" opacity="0.9"/>
  <!-- Winged Emblem -->
  <path d="M45,85 Q100,105 155,85 Q140,110 100,118 Q60,110 45,85 Z" fill="url(#goldGrad)"/>
  <path d="M60,78 Q100,92 140,78 Q128,98 100,104 Q72,98 60,78 Z" fill="#12151b" opacity="0.5"/>
  <!-- Royal Enfield Text -->
  <text x="100" y="60" text-anchor="middle" font-family="'Oswald', sans-serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="3">ROYAL ENFIELD</text>
  <text x="100" y="142" text-anchor="middle" font-family="'Oswald', sans-serif" font-size="10" font-weight="600" fill="url(#goldGrad)" letter-spacing="4">SINCE 1901</text>
  <text x="100" y="158" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#cbd5e1" letter-spacing="1.5">DIGITAL CAMPAIGN</text>
  <!-- Center Star/Cannon emblem symbol -->
  <circle cx="100" cy="98" r="6" fill="#ffffff"/>
  <polygon points="100,86 103,95 112,98 103,101 100,110 97,101 88,98 97,95" fill="url(#goldGrad)"/>
</svg>
